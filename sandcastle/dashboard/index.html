<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sandcastle status</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; background: #0f0f12; color: #e8e8ed; }
    pre { background: #1a1a22; padding: 1rem; border-radius: 8px; overflow: auto; }
    a { color: #7cb7ff; }
    input { width: 320px; padding: 0.5rem; border-radius: 6px; border: 1px solid #333; background: #111; color: #eee; }
    button { margin-left: 0.5rem; padding: 0.5rem 1rem; border-radius: 6px; border: none; background: #3b5bdb; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Sandcastle</h1>
  <p>Phase 2 dashboard — reads <code>GET /v1/status</code> (needs API key).</p>
  <label>API base <input id="base" value="http://127.0.0.1:8787" /></label>
  <label>API key <input id="key" type="password" value="dev" /></label>
  <button type="button" id="go">Load status</button>
  <pre id="out">{}</pre>
  <script>
    document.getElementById("go").onclick = async () => {
      const base = document.getElementById("base").value.replace(/\/$/, "");
      const key = document.getElementById("key").value;
      const r = await fetch(base + "/v1/status", { headers: { Authorization: "Bearer " + key } });
      const j = await r.json().catch(() => ({ error: await r.text() }));
      document.getElementById("out").textContent = JSON.stringify(j, null, 2);
    };
  </script>
</body>
</html>
