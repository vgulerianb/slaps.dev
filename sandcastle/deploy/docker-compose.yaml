services:
  sandcastle:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8787:8787"
    environment:
      SANDCASTLE_API_KEYS: dev
      SANDCASTLE_MAX_CONCURRENT: "8"
      SANDCASTLE_SKIP_PACKAGE_INSTALL: "1"
    volumes:
      - sandcastle-data:/data

  worker:
    profiles:
      - worker
    build:
      context: ..
      dockerfile: Dockerfile.agent
    ports:
      - "9797:9797"
    environment:
      SANDCASTLE_DATA_DIR: /data
      SANDCASTLE_AGENT_BIND: 0.0.0.0:9797
    volumes:
      - sandcastle-data:/data

volumes:
  sandcastle-data: {}
