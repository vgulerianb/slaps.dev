[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sandcastle-sdk"
version = "0.1.0"
description = "Sandcastle API client for Python"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["src/sandcastle"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
